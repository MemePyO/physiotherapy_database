[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP031", "E402", "E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["main", "db", "lang", "theme", "utils", "log", "paths", "workers", "dialogs", "ui", "services", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 70

[tool.mypy]
files = ["db.py", "services"]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "(^|/)(tests|data|build|dist)/"
