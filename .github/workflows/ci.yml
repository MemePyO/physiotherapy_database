name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest pytest-cov mypy

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Type check
        run: mypy

      - name: Run tests
        run: python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=70

      - name: Source startup self-test
        shell: pwsh
        run: |
          $env:PHYSIO_DATA_DIR = Join-Path $env:RUNNER_TEMP "physio-source-self-test"
          python main.py --self-test --self-test-report (Join-Path $env:RUNNER_TEMP "source-self-test.json")

      - name: Build executable
        run: pyinstaller --noconfirm --clean PhysioDatabase.spec

      - name: Verify packaged startup
        run: python scripts/verify_release.py --exe dist/PhysioDatabase.exe